name: Deploy

# Build the image (with the branding package baked in), push it to GHCR, deploy
# to the target EC2 host over SSH, and (on dev) gate on the QA smoke suite.
#
#   push to dev / branding-updated -> environment "development" -> tag :dev, branding@dev  -> smoke gate, rollback on failure
#   push to main                   -> environment "production"  -> tag :prod, branding@main
#
# NEXT_PUBLIC_* values are baked into the client bundle at build time (so they
# are public), and come from the selected environment's variables.
#
# Forks: set repo variable COMPOSE_SERVICE to enable the deploy job, and
# QA_REPO (repo name, same owner) to enable the smoke gate. BRANDING_REPO
# defaults to <owner>/ids-drr-india-branding.

on:
  push:
    branches: [dev, main]
  # Sent by the branding repo on push to dev; runs on the default branch (dev).
  repository_dispatch:
    types: [branding-updated]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  ENV_TAG: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}

jobs:
  build-and-push:
    name: Build & push image
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          path: IDS-DRR-Frontend

      - uses: actions/checkout@v6.0.3
        with:
          repository: ${{ vars.BRANDING_REPO || format('{0}/ids-drr-india-branding', github.repository_owner) }}
          ref: ${{ github.ref == 'refs/heads/main' && 'main' || 'dev' }}
          path: ids-drr-india-branding

      # ghcr.io image paths must be lowercase; the repo slug is mixed-case.
      - id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          push: true
          context: .
          file: IDS-DRR-Frontend/Dockerfile
          target: runner
          build-args: |
            CONTEXT_SUBDIR=IDS-DRR-Frontend
            BRANDING_PACKAGE=ids-drr-india-branding
            NEXT_PUBLIC_DATA_MANAGEMENT_LAYER_URL=${{ vars.NEXT_PUBLIC_DATA_MANAGEMENT_LAYER_URL }}
            NEXT_PUBLIC_BACKEND_URL=${{ vars.NEXT_PUBLIC_BACKEND_URL }}
            NEXT_PUBLIC_TIME_PERIOD=${{ vars.NEXT_PUBLIC_TIME_PERIOD }}
            NEXT_PUBLIC_GOOGLE_ANALYTICS_APP_ID=${{ vars.NEXT_PUBLIC_GOOGLE_ANALYTICS_APP_ID }}
            NEXT_PUBLIC_DOWNLOAD_REPORT_LINK=${{ vars.NEXT_PUBLIC_DOWNLOAD_REPORT_LINK }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ env.ENV_TAG }}
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2
    needs: build-and-push
    if: vars.COMPOSE_SERVICE != ''
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
    steps:
      - name: Pull & restart on host
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: TOKEN,REG_USER,DEPLOY_PATH,SERVICE,IMAGE,ENV_TAG
          script: |
            set -euo pipefail
            echo "$TOKEN" | sudo docker login ghcr.io -u "$REG_USER" --password-stdin
            cd "$DEPLOY_PATH"
            # Keep the running image so the rollback job can restore it.
            running=$(sudo docker compose images -q "$SERVICE" | head -1)
            [ -n "$running" ] && sudo docker tag "$running" "$IMAGE:rollback"
            sudo IMAGE_TAG="$ENV_TAG" docker compose pull "$SERVICE"
            sudo IMAGE_TAG="$ENV_TAG" docker compose up -d --no-build "$SERVICE"
            sudo docker image prune -f
            sudo docker logout ghcr.io
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REG_USER: ${{ github.actor }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          SERVICE: ${{ vars.COMPOSE_SERVICE }}
          IMAGE: ${{ needs.build-and-push.outputs.image }}

  dev-smoke:
    name: Smoke (dev)
    needs: deploy
    if: github.ref == 'refs/heads/dev' && vars.QA_REPO != ''
    runs-on: ubuntu-latest
    steps:
      # Triggers the QA repo's dispatch.yml and blocks until it finishes; this
      # job (and its check) is green only if smoke passes.
      - uses: convictional/trigger-workflow-and-wait@f69fa9eedd3c62a599220f4d5745230e237904be # v1.6.5
        with:
          owner: ${{ github.repository_owner }}
          repo: ${{ vars.QA_REPO }}
          github_token: ${{ secrets.QA_REPO_PAT }}
          workflow_file_name: dispatch.yml
          ref: main
          wait_interval_seconds: 30
          client_payload: '{"scope":"smoke","target_env":"dev"}'

  rollback-dev:
    name: Roll back dev
    needs: [build-and-push, dev-smoke]
    if: failure() && needs.dev-smoke.result == 'failure'
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DEPLOY_PATH,SERVICE,IMAGE
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"
            sudo docker tag "$IMAGE:rollback" "$IMAGE:dev"
            sudo IMAGE_TAG=dev docker compose up -d --no-build "$SERVICE"
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          SERVICE: ${{ vars.COMPOSE_SERVICE }}
          IMAGE: ${{ needs.build-and-push.outputs.image }}
