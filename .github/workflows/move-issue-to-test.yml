name: Move Issues on PR Merge

on:
  pull_request:
    types: [closed]

jobs:
  move_issues:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Authenticate GitHub CLI
        run: echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: Extract issues from PR body
        id: extract_issues
        run: |
          issues=$(echo "${{ github.event.pull_request.body }}" | grep -oE '#[0-9]+' | tr -d '#')
          echo "issues=$issues" >> $GITHUB_ENV

      - name: Move issues to Ready to Test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT_ID: ${{ secrets.PROJECT_ID }}
          COLUMN_ID: ${{ secrets.COLUMN_ID }}
        run: |
          IFS=',' read -ra ISSUES <<< "$issues"
          for issue in "${ISSUES[@]}"; do
            echo "Processing issue #$issue"
            issue_url=$(gh api /repos/${{ github.repository }}/issues/$issue -q '.url')
            project_card_id=$(gh api graphql -f query='
              query {
                repository(owner: "${{ github.repository_owner }}", name: "${{ github.event.repository.name }}") {
                  issue(number: '$issue') {
                    projectCards(first: 1) {
                      nodes {
                        id
                      }
                    }
                  }
                }
              }
            ' -q '.data.repository.issue.projectCards.nodes[0].id')
            if [ -z "$project_card_id" ]; then
              echo "No project card found for issue #$issue"
              continue
            fi
            gh api graphql -f mutation='
              mutation {
                moveProjectCard(input: { cardId: "'$project_card_id'", columnId: "'$COLUMN_ID'" }) {
                  clientMutationId
                }
              }
            '
          done
